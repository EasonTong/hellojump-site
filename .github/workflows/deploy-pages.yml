name: Deploy to GitHub Pages

# 三条触发路径：
#   push      —— 改了代码就发布
#   schedule  —— 每小时重新构建一次，刷新榜单/公告快照（静态导出没有 ISR，这是唯一的刷新手段）
#   dispatch  —— 后台改了公告，可以手动点一下立刻重建，不用等整点
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；但不取消进行中的那个，避免把线上留在半截状态
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build static export
        env:
          # 项目页挂在 /hellojump-site/ 子路径下，必须告诉 Next 加前缀，
          # 否则 /_next/* 资源会 404（页面白屏）
          NEXT_PUBLIC_BASE_PATH: /hellojump-site
          # 注意：anon key 是**公开信息**（它本来就打包进 APK 和本站 JS 里），
          # 放 secrets 只是不让它显示在 GitHub UI 上，不代表它是机密。
          # 真正保护数据的是数据库的 RLS 与视图权限。
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Show output
        run: |
          echo "导出目录："
          ls -la out/ | head -20
          echo "页面数：$(find out -name 'index.html' | wc -l)"
          echo ".nojekyll 是否存在：$(test -f out/.nojekyll && echo yes || echo NO)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
